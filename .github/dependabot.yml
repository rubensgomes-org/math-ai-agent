# =============================================================================
# Dependabot version updates
#
# Daily pull requests for Poetry dependencies (`pip` reads `poetry.lock`)
# and GitHub Actions. Security alerts and security update pull requests are
# enabled separately under the repository's Settings.
# =============================================================================
version: 2

updates:
    - package-ecosystem: "pip"
      directory: "/"
      schedule:
          interval: "daily"
      groups:
          python-minor-and-patch:
              update-types:
                  - "minor"
                  - "patch"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
