# =============================================================================
# Delete App Configuration
#
# DESTRUCTIVE. Deletes this app's key-values (prefix "ca-mathagent", label
# <environment_name>) from the environment's Azure App Configuration store by
# calling the reusable config-app-delete workflow in the `azure-workflows`
# repo.
# =============================================================================
name: App Configuration Delete

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment; also the key-value label.'
        required: true
        type: choice
        options:
          - dev
          - lab
      confirm:
        description: >
          DELETES THIS APP'S KEY-VALUES FROM THE APP CONFIGURATION STORE.
          Choose "Yes" to confirm.
        required: true
        type: choice
        default: "No"
        options:
          - "No"
          - "Yes"
      prefix:
        description: 'Key prefix for the imported key-values.'
        required: false
        default: ca-mathagent/
        type: string


permissions:
  contents: read

concurrency:
  group: config-app
  cancel-in-progress: false

jobs:
  delete-config:
    name: Delete the App Configuration key-values
    if: ${{ inputs.confirm == 'Yes' }}
    # Store name from azure-iac: appcs-<workload>-<env>.
    uses: rubensgomes-org/azure-workflows/.github/workflows/config-app-delete.yml@v0
    with:
      name: appcs-${{ vars.TF_VAR_WORKLOAD }}-${{ inputs.environment_name }}
      prefix: ${{ inputs.prefix }}
      label: ${{ inputs.environment_name }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
