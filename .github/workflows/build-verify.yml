# =============================================================================
# build-verify
#
# Installs dependencies, then runs static type checking, static code
# analysis, and unit test coverage, then blocks on the SonarCloud quality
# gate. Dispatch-only on purpose.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: build-verify

on:
    workflow_dispatch:
        inputs:
            run-sonar:
                description: 'Run the SonarCloud analysis and quality gate.'
                required: false
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-verify:
        uses: rubensgomes-org/azure-workflows/.github/workflows/poetry-build-verify.yml@v0
        with:
            run-sonar: ${{ inputs.run-sonar }}
        secrets:
            # The Sonar static analysis run is optional, and you do NOT need a
            # SONAR_TOKEN unless you enable to run sonar.
            sonar-token: ${{ secrets.SONAR_TOKEN }}
