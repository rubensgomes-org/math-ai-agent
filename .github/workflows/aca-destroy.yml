# =============================================================================
# aca-destroy
#
# DESTRUCTIVE. Destroys the container apps module only, by calling the
# reusable ACA Destroy workflow in the Terraform IaC `azure-iac` repo.
# Resource groups, networking, log analytics, managed identity, key vault,
# ACR and the container app environment are left standing.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: aca-destroy

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment holding the apps.'
        required: true
        type: choice
        options:
          - dev
          - lab
      confirm:
        description: >
          DESTROYS THE CONTAINER APPS ONLY. Resource groups, managed
          identity, key vault, ACR and the environment are NOT touched.
          Choose "Yes" to confirm.
        required: true
        type: choice
        default: "No"
        options:
          - "No"
          - "Yes"

permissions:
  contents: read

concurrency:
  group: aca-destroy
  cancel-in-progress: false

jobs:
  destroy:
    uses: rubensgomes-org/azure-iac/.github/workflows/aca-destroy.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      apps: '["mathagent"]'
      confirm: ${{ inputs.confirm }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
