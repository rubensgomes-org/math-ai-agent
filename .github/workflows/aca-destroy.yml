# =============================================================================
# Delete Repo and Destroy ACA
#
# DESTRUCTIVE. Destroys the container apps module only, by calling the
# reusable ACA Destroy workflow in the Terraform IaC `azure-iac` repo, then
# deletes the app's ACR repository. Resource groups, networking, log
# analytics, managed identity, key vault, the ACR registry and the container
# app environment are left standing.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Delete Repo and Destroy ACA

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment holding the apps.'
        required: true
        type: choice
        options:
          - dev
          - lab
      confirm:
        description: >
          DESTROYS THE CONTAINER APPS AND THE APP'S ACR REPOSITORY ONLY.
          Resource groups, managed identity, key vault, the ACR registry and
          the environment are NOT touched.
          Choose "Yes" to confirm.
        required: true
        type: choice
        default: "No"
        options:
          - "No"
          - "Yes"

permissions:
  contents: read

concurrency:
  group: aca-destroy
  cancel-in-progress: false

jobs:
  resolve-acr:
    name: Resolve the ACR registry name
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.resolve.outputs.acr_name }}
    steps:
      - id: resolve
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT_NAME" in
            dev) acr_name=crrgomesdev01 ;;
            lab) acr_name=crrgomeslab02 ;;
            *)
              echo "Unknown environment: '${ENVIRONMENT_NAME}'." >&2
              exit 1
              ;;
          esac
          echo "acr_name=${acr_name}" >> "$GITHUB_OUTPUT"
          echo "Resolved acr_name: ${acr_name}"

  delete-acr-repo:
    name: Delete ACR repository
    needs: [resolve-acr, destroy-aca]
    if: ${{ inputs.confirm == 'Yes' }}
    uses: rubensgomes-org/azure-workflows/.github/workflows/acr-repo-delete.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      registry-name: ${{ needs.resolve-acr.outputs.acr_name }}
      artifact-id: math-ai-agent
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  destroy-aca:
    name: Destroy the ACA container app
    uses: rubensgomes-org/azure-iac/.github/workflows/aca-destroy.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      apps: '["mathagent"]'
      confirm: ${{ inputs.confirm }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
