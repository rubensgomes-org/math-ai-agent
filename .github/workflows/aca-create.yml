# =============================================================================
# Create ACA
#
# Provisions the Azure Container App estate (resource groups, networking,
# log analytics, managed identity, key vault, ACR, container app environment
# and container apps) by calling the reusable ACA Create workflow in the
# Terraform IaC `azure-iac` repo.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Create ACA

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment to provision.'
        required: true
        type: choice
        options:
          - dev
          - lab

permissions:
  contents: read

concurrency:
  group: aca-create
  cancel-in-progress: false

jobs:
  resolve-acr:
    name: Resolve the ACR registry name
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.resolve.outputs.acr_name }}
    steps:
      - id: resolve
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        run: |
          case "$ENVIRONMENT_NAME" in
            dev) echo "acr_name=crrgomesdev01" >> "$GITHUB_OUTPUT" ;;
            lab) echo "acr_name=crrgomeslab02" >> "$GITHUB_OUTPUT" ;;
          esac

  create:
    name: Create ACA container app
    needs: resolve-acr
    uses: rubensgomes-org/azure-iac/.github/workflows/aca-create.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      acr_name: ${{ needs.resolve-acr.outputs.acr_name }}
      apps: '["mathmcp","mathagent"]'
      health_probe_paths: '{"mathmcp":"/health","mathagent":"/health"}'
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
