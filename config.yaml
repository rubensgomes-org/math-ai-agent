# =============================================================================
# Server Configuration
# =============================================================================
server:
    calculator_mcp:
        #    is_oauth: false
        #    url: "http://127.0.0.1:9000/mcp"
        is_oauth: true
        url: "https://rubens-calculator-mcp.fastmcp.app/mcp"
        # location to store OAuth token
        token_dir: "/tmp/.fastmcp/oauth-tokens"
        # fixed port for the OAuth callback server
        callback_port: 10000
        # timeout in seconds
        timeout: 10

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
    # Which OpenAI API the LLM client uses:
    #   "responses" -> POST /v1/responses         (primary OpenAI API)
    #   "chat"      -> POST /v1/chat/completions  (legacy, still supported)
    # Both work against NVIDIA; switch to "chat" if the provider's
    # Responses endpoint misbehaves.
    api_style: "responses"

    # Base URL of the LLM model inference endpoint (no route suffix).
    model_base_url: "https://integrate.api.nvidia.com/v1"
    # Model identifier. NVIDIA's served catalog is public:
    #   GET https://integrate.api.nvidia.com/v1/models
    model: "nvidia/nemotron-3-super-120b-a12b"
    # Name of the environment variable holding the API key.
    # The key value itself is NEVER stored in this file.
    # Get a key from https://build.nvidia.com (keys start with "nvapi-").
    api_key_env: "NVIDIA_API_KEY"

    # OpenRouter alternative. Its free tier allows only 50 requests per
    # day, after which requests fail with 429 free-models-per-day. The
    # ":free" suffix is OpenRouter slug syntax and is not a valid model
    # id on any other provider.
    #   model_base_url: "https://openrouter.ai/api/v1"
    #   model: "nvidia/nemotron-3-super-120b-a12b:free"
    #   api_key_env: "OPENROUTER_API_KEY"
    # Local Ollama alternative (see OLLAMA.md):
    #   model_base_url: "http://localhost:11434/v1"
    #   model: "phi"

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
    version: 1
    disable_existing_loggers: false
    formatters:
        standard:
            format: "%(asctime)s [%(levelname)s] %(name)s %(filename)s:%(lineno)d: %(message)s"
    handlers:
        console:
            class: logging.StreamHandler
            formatter: standard
            stream: ext://sys.stderr
    loggers:
        math_ai_agent:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # MCP protocol tracing — set to DEBUG to see full JSON-RPC messages
        mcp.client.streamable_http:
            level: INFO
            handlers:
                - console
            propagate: false
        # HTTP request/response summaries — set to DEBUG for detail
        httpx:
            level: INFO
            handlers:
                - console
            propagate: false
        # OpenAI SDK logging — set to DEBUG for request/response detail
        openai:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # HTTP wire-level tracing (headers, TCP) — set to DEBUG for detail
        httpcore:
            level: INFO
            handlers:
                - console
            propagate: false
        # Server: HTTP request lines (method, path, status)
        uvicorn.access:
            level: INFO
            handlers:
                - console
            propagate: false
        # Integration tests (via pytest)
        tests:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # Integration tests (run standalone)
        __main__:
            level: DEBUG
            handlers:
                - console
            propagate: false
    root:
        level: WARNING
        handlers:
            - console
