[project]
name = "math-ai-agent"
keywords = ["ai", "math", "llm", "mcp", "agentic"]
version = "0.0.55"
description = "Math AI Agent that uses LLM + Rubens calculator-mcp."
authors = [
    { name = "Rubens Gomes", email = "rubens.s.gomes@gmail.com" }
]
maintainers = [
    { name = "Rubens Gomes", email = "rubens.s.gomes@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4.0.0"
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 4 - Beta",
    # Python versions supported.
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "ai-utils-lib (>=0,<1)",
    "colorlog (>=6.12.0,<7)",
    "cryptography (>=50.0.2,<51)",
    "fastapi (>=0.141.1,<1)",
    "fastmcp-slim[client] (>=4.0.11,<5)",
    "httpx2 (>=2.13,<3)",
    "mcp (>=2.2.0,<3)",
    "mcp-types (>=2.3.0,<3)",
    "openai (>=3.25.0,<4)",
    "pydantic (>=2.13.5,<3)",
    "pyyaml (>=6.0.3,<7)",
    "py-key-value-aio (>=0.4.6,<1)",
    "uvicorn (>=0.54.0,<0.55)",
    "websockets (>=17.2,<18)",
    # Azure dependencies
    "azure-appconfiguration-provider (>=2.5,<3)",
    "azure-identity (>=1.26,<2)",
    "azure-keyvault-secrets (>=4.11,<5)",
    "aiohttp (>=3.13,<4)",
]

[project.scripts]
math-ai-agent = "math_ai_agent.cli:main"

[build-system]
requires = ["poetry-core>=2.5,<3"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.10,<27)",
    "flake8 (>=7.4,<8)",
    "isort (>=9.0,<10)",
    "mypy (>=2.4,<3)",
    "pip-audit (>=2.10,<3)",
    "poethepoet (>=0.48,<1)",
    "poetry (>=2.5,<3)",
    "pylint (>=4.1,<5)",
    "pysonar (>=1.9,<3)",
    "types-pyyaml (>=6.0,<7)",
]
test = [
    "coverage (>=7.16,<8)",
    "httpx (>=0.28.1,<1)",
    "pytest (>=9.1,<10)",
    "pytest-asyncio (>=1.4,<2)",
    "pytest-cov (>=7.1,<8)",
    "fastmcp-slim[server] (>=4.0.11,<5)",
]

[project.urls]
Homepage = "https://github.com/rubensgomes-org/math-ai-agent/"
Documentation = "https://github.com/rubensgomes-org/math-ai-agent/blob/main/README.md"
Repository = "https://github.com/rubensgomes-org/math-ai-agent/"

################################################################################
# ---------- >>> Tools <<< -----------------------------------------------------
################################################################################

[tool.black]
line-length = 80
target-version = ["py314"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.coverage.run]
source = ["math_ai_agent"]
branch = true

[tool.isort]
line_length = 80
profile = "black"

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true

[tool.poetry]
packages = [{ include = "math_ai_agent", from = "src" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing --cov-report=xml"

# ---------- >>> poethepoet tasks <<< -----------------------------------------

# To run a poe task:
# `poetry run poe <task-name>` OR
# `poe <task-name>` (e.g., poe clean)

[tool.poe.tasks]
# Poe the Poetry "poethepoet" task runner needs to be installed.
# Define individual cleanup tasks
_clean_cache = "poetry cache clear --all"
_clean_misc = "rm -rf  .mypy_cache dist build"
_clean_pyc = "find . -name '*.pyc' -delete"
_clean_pycache = "find . -name '__pycache__' -type d -exec rm -rf {} +"
_clean_pytest = "rm -rf .pytest_cache"
_clean_venv = "poetry env remove --all"

# Combine them into one 'clean' command.  Similar to `make clean`
[tool.poe.tasks.clean]
sequence = [
    "_clean_cache",
    "_clean_misc",
    "_clean_pyc",
    "_clean_pycache",
    "_clean_pytest",
    "_clean_venv",
]
help = "Remove all project artifacts"
