# =============================================================================
# LLM Configuration
# =============================================================================
llm:
    # OpenAI API the LLM client uses:
    #   "responses" -> POST /v1/responses         (primary OpenAI API)
    #   "chat"      -> POST /v1/chat/completions  (legacy, still supported)
    # Both work against NVIDIA nemotron models
    api_style: "responses"

    # ---------- >>> NVIDIA Open LLM <<< ----------------------------
    # Base NVIDIA LLM models URL
    model_base_url: "https://integrate.api.nvidia.com/v1"
    # Nemotron frontier NVIDIA models for agentic workflows, coding and tool use
    # see list of NVIDIA models: https://integrate.api.nvidia.com/v1/models
    # https://build.nvidia.com/nvidia/nemotron-3-ultra-550b-a55b/modelcard
    # nemotron is a reasoning model
    model: "nvidia/nemotron-3-ultra-550b-a55b"
    # Name of the environment variable holding the API key.
    # Get a key from https://build.nvidia.com (keys start with "nvapi-").
    api_key_env: "NVIDIA_API_KEY"
    # Sampling temperature between 0 and 2. Higher values like 0.8 make the
    # output more random, while lower values like 0.2 make it more focused
    # and deterministic.
    temperature: 0.2
    #temperature: 1.4
    #temperature: 1.7
    #temperature: 1.9

    # ---------- >>> OpenAI Paid LLM <<< ----------------------------
    # Base OpenAI LLM models URL
#    model_base_url: "https://api.openai.com/v1"
    # `gpt-6-luna` is an OpenAI low cost LLM:
    #   Input tokens:  $0.10 per 1 million input tokens
    #   Output tokens: $0.50 per 1 million output tokens
    # gpt-6-luna is a non-reasoning LLM model
#    model: "gpt-6-luna"
    # Name of the environment variable holding the API key.
    # Get a key from https://platform.openai.com/api-keys
#    api_key_env: "OPENAI_API_KEY"
    # Sampling temperature between 0 and 2. Higher values like 0.8 make the
    # output more random, while lower values like 0.2 make it more focused
    # and deterministic.
    # temperature is an unsupported parameter for `gpt-6-luna`
    #temperature:

    # System prompt sent to the **stateless** LLM on every request.
    # Seconds to wait for each LLM response before failing.
    timeout_seconds: 120
    # Concurrent prompts ≈ prompts per second × average seconds per prompt.
    # Prompts processed at once; more get HTTP 503 until one finishes.
    # Each prompt makes several LLM calls, so the LLM provider's rate limits
    # and latency are the main bottleneck. Raise it if your provider's rate
    # limits can handle more parallel work.
    max_concurrent_prompts: 10
    # Responses API only: store responses on the server and send only new
    # items each turn via previous_response_id. NVIDIA and OpenRouter do
    # not support it; OpenAI does and keeps stored responses for 30 days.
    is_stateful: false
    system_instructions: >-
        You are a careful math assistant tutor helping solve math problems.
        Always write a short plan first. Do NOT do arithmetic in your head.
        For every math operation, request a tool call to the calculator.
        After tool results, continue. Provide final answer with explanation.
        Respond in plain text only. Do NOT use LaTeX, Markdown, or any other
        special formatting: no backslashes, no asterisks, no dollar-sign or
        parenthesis math delimiters. Write math inline, like 4 x 3 = 12.
        Your answer is shown in a plain text box that cannot render
        formatting.

    # OpenRouter alternative. Its free tier allows only 50 requests per
    # day, after which requests fail with 429 free-models-per-day. The
    # ":free" suffix is OpenRouter slug syntax and is not a valid model
    # id on any other provider.
    #   model_base_url: "https://openrouter.ai/api/v1"
    #   model: "nvidia/nemotron-3-super-120b-a12b:free"
    #   api_key_env: "OPENROUTER_API_KEY"
    # Local Ollama alternative (see OLLAMA.md):
    #   model_base_url: "http://localhost:11434/v1"
    #   model: "phi"

# =============================================================================
# Calculator MCP Server Configuration
# =============================================================================
server:
    calculator_mcp:
        # URL of the Calculator MCP Server End-Point
        # url: "http://127.0.0.1:8080/mcp"
        # Hosted, deployed and running for free at Prefect
        #   https://www.prefect.io/horizon
        url: "https://rubens-calculator-mcp.fastmcp.app/mcp"
        # is_oauth: false
        # Prefect requires OAuth authentication. Currently only Rubens is able
        # to authorize using his personal GitHub account.
        is_oauth: true
        # location to store OAuth token
        token_dir: "~/.mathaiagent"
        # local port temporarily used by the OAuth callback server during
        # OAuth handshaking.
        callback_port: 10000

# =============================================================================
# Web App Configuration (used by the math-ai-agent command)
# =============================================================================
web:
    host: "127.0.0.1"
    # ensure below port does not conflict with locally running MCP server.
    port: 9090

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
    version: 1
    disable_existing_loggers: false
    formatters:
        # Colors level name and message; plain if stderr is not a TTY or NO_COLOR
        # set environment variable NO_COLOR=true for plain text with no color.
        standard:
            (): colorlog.ColoredFormatter
            fmt: "%(asctime)s %(log_color)s[%(levelname)s]%(reset)s %(fg_147)s%(name)s %(filename)s:%(lineno)d%(reset)s: %(log_color)s%(message)s%(reset)s"
            datefmt: "%H:%M:%S"
            log_colors:
                DEBUG: cyan
                INFO: light_green
                WARNING: yellow
                ERROR: red
                CRITICAL: bold_red
            stream: ext://sys.stderr
    handlers:
        console:
            class: logging.StreamHandler
            formatter: standard
            stream: ext://sys.stderr
    loggers:
        #############################################################
        # ---------- >>> math_ai_agent <<< -------------------------#
        #############################################################
        math_ai_agent:
            level: DEBUG
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> fastmcp <<< -------------------------------#
        #############################################################
        fastmcp:
            level: DEBUG
            handlers:
                - console
            propagate: false
#        # FastMCP OAuth client (fastmcp/client/auth/oauth.py)
#        fastmcp.client.auth.oauth:
#        # FastMCP client tool calls (fastmcp/client/mixins/tools.py)
#        fastmcp.client.mixins.tools:
#        # FastMCP client core (fastmcp/client/client.py)
#        fastmcp.client.client:
        #############################################################
        # ---------- >>> mcp <<< -----------------------------------#
        #############################################################
        mcp:
            level: DEBUG
            handlers:
                - console
            propagate: false
#        # MCP protocol tracing — set to DEBUG to see full JSON-RPC messages
#        mcp.client.streamable_http:
        #############################################################
        # ---------- >>> httpx <<< ---------------------------------#
        #############################################################
        # HTTP request/response summaries — set to DEBUG for detail
        httpx:
            level: INFO
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> httpcore <<< ------------------------------#
        #############################################################
        # HTTP wire-level tracing (headers, TCP) — set to DEBUG for detail
        httpcore:
            level: DEBUG
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> openai <<< --------------------------------#
        #############################################################
        openai:
            level: INFO
            handlers:
                - console
            propagate: false
        # Integration tests (via pytest)
        tests:
            level: DEBUG
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> uvicorn <<< -------------------------------#
        #############################################################
        # Server: startup, shutdown, and errors
        uvicorn:
            level: DEBUG
            handlers:
                - console
            propagate: false
#        # Server: HTTP request lines (method, path, status)
#        uvicorn.access:
        __main__:
            level: DEBUG
            handlers:
                - console
            propagate: false
    root:
        level: WARNING
        handlers:
            - console
