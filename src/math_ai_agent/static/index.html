<!doctype html>
<html lang="en"
      data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control"
          content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma"
          content="no-cache">
    <meta http-equiv="Expires"
          content="0">
    <!-- Extra meta tags -->
    <meta name="author"
          content="Rubens Gomes">
    <meta name="description"
          content="A Math AI Agent that uses the MCP calculator for all arithmetic.">
    <title>Math AI Agent</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <!-- Darker button colors for better white-text contrast -->
    <style>
        .btn-primary {
            --bs-btn-bg: #084298;
            --bs-btn-border-color: #084298;
            --bs-btn-hover-bg: #052c65;
            --bs-btn-hover-border-color: #052c65;
            --bs-btn-active-bg: #052c65;
            --bs-btn-active-border-color: #052c65;
            --bs-btn-disabled-bg: #084298;
            --bs-btn-disabled-border-color: #084298;
        }

        .btn-secondary {
            --bs-btn-bg: #495057;
            --bs-btn-border-color: #495057;
            --bs-btn-hover-bg: #343a40;
            --bs-btn-hover-border-color: #343a40;
            --bs-btn-active-bg: #343a40;
            --bs-btn-active-border-color: #343a40;
            --bs-btn-disabled-bg: #495057;
            --bs-btn-disabled-border-color: #495057;
        }
    </style>
</head>
<body>
<header>
    <noscript>
        <div class="fixed-top mt-7 fw-bold alert alert-danger"
             role="alert">
            Your browser does not have Javascript enabled. This web page does
            not work correctly without Javascript. See <a class="link-primary"
                                                      href="https://www.enable-javascript.com/"
                                                      rel="external">instructions</a>
            to enable Javascript.
        </div>
    </noscript>
</header>
<div class="container">
    <h2>Math AI Agent!</h2>
    <p>Ask a math question. The app will use the MCP calculator for all
        arithmetic.</p>
    <form class="row g-3">
        <!-- math question prompt -->
        <div class="col-12">
            <label for="textarea-question-id"
                   class="form-label">Math question:</label>
            <textarea id="textarea-question-id"
                      name="question"
                      class="form-control"
                      rows="3"></textarea>
            <div class="invalid-feedback">
                Please enter a math question.
            </div>
        </div>
        <div class="col-12">
            <button id="button-submit-id" type="button" class="btn btn-primary">
                <span id="spinner-submit-id"
                      class="spinner-border spinner-border-sm d-none"
                      aria-hidden="true"></span>
                Submit
            </button>
            <button id="button-clear-id" type="button" class="btn btn-secondary">
                Clear
            </button>
        </div>
    </form>

    <div class="row g-3 mt-3">
        <div class="col-12">
            <label for="textarea-response-id"
                   class="form-label">Response:</label>
            <textarea id="textarea-response-id"
                      class="form-control"
                      rows="3"
                      readonly></textarea>
        </div>
        <div class="col-12">
            <button id="button-clear-response-id" type="button" class="btn btn-secondary">
                Clear
            </button>
        </div>
    </div>

</div>

<script>
    const submitButton = document.getElementById("button-submit-id");
    const clearButton = document.getElementById("button-clear-id");
    const submitSpinner = document.getElementById("spinner-submit-id");
    const questionTextarea = document.getElementById("textarea-question-id");

    questionTextarea.oninput = () => {
        questionTextarea.classList.remove("is-invalid");
    };

    function setBusy(isBusy) {
        submitButton.disabled = isBusy;
        clearButton.disabled = isBusy;
        submitSpinner.classList.toggle("d-none", !isBusy);
    }

    submitButton.onclick = async () => {
        const prompt = questionTextarea.value;
        if (prompt.trim() === "") {
            questionTextarea.classList.add("is-invalid");
            return;
        }
        setBusy(true);
        try {
            const res = await fetch("/prompt/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text: prompt})
            });
            const data = await res.json();
            document.getElementById("textarea-response-id").value =
                res.ok ? data.answer : `Error: ${data.detail}`;
        } finally {
            setBusy(false);
        }
    };

    clearButton.onclick = () => {
        questionTextarea.value = "";
        questionTextarea.classList.remove("is-invalid");
    };

    document.getElementById("button-clear-response-id").onclick = () => {
        document.getElementById("textarea-response-id").value = "";
    };
</script>

</body>
</html>
