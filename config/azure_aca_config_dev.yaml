# "dev" environment configuration settings.
# ====================================================================
# Microsoft Azure Configuration
# ====================================================================
azure:
    # App Configuration prefix
    app_config_prefix: "ca-mathagent/"
    # app configuration prefix separator
    app_config_separator: "/"
    # Key Vault prefix
    secret_prefix: "ca-mathagent--"


# ====================================================================
# Microsoft Foundry Configuration
# ====================================================================
foundry:
    project_endpoint: "https://aif-rgomes-dev.services.ai.azure.com/api/projects/proj-rgomes-dev"


# ====================================================================
# MCP Configuration
# ====================================================================
mcp:
    calculator:
        url: "http://ca-mathmcp-dev/mcp"
        is_oauth: false
        # location to store OAuth token in the local machine
        token_dir: ""
        # local port temporarily used by the OAuth callback
        callback_port: 10000


# ====================================================================
# SLM or LLM Model Configuration
# ====================================================================
model:
    # OpenAI API style:
    #   "responses" -> POST /v1/responses         (newer and preferred)
    #   "chat"      -> POST /v1/chat/completions  (legacy)
    api_style: "responses"
    base_url: "https://aif-rgomes-dev.services.ai.azure.com/openai/v1"
    name: "gpt-4.1-nano"
    # environment variable holding the API key.
    # we should use Azure credentials for Foundry models.
    api_key_env: ""
    # system instructions being provided to the model.
    instructions: >-
        You are a careful math assistant tutor helping solve math problems.
        Always write a short plan first. Do NOT do arithmetic in your head.
        For every math operation, request a tool call to the calculator.
        After tool results, continue. Provide final answer with explanation.
        Respond in plain text only. Do NOT use LaTeX, Markdown, or any other
        special formatting: no backslashes, no asterisks, no dollar-sign or
        parenthesis math delimiters. Write math inline, like 4 x 3 = 12.
        Your answer is shown in a plain text box that cannot render
        formatting.
    # Requires both Responses API and model support. It stores conversaiont history on the model server end, and send only new items each turn via
    # previous_response_id.
    is_stateful: false
    # Concurrent prompts per second processed at once
    max_concurrent_prompts: 10
    # sampling temperature between 0 and 2.
    temperature: 1.0
    # Seconds to wait for each model response before failing.
    timeout_seconds: 30


# ====================================================================
# Web App Configuration (e.g., used by FastAPI web app server)
# ====================================================================
web:
    host: "0.0.0.0"
    # ensure below port does not conflict with other services.
    port: 8080
