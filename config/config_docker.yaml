# =============================================================================
# Container configuration used by the Docker image (see Dockerfile).
# =============================================================================

# "llm" section is ONLY loaded by local docker. ACA does not use this
# section.  Instead ACA uses the "llm" settings from App Configuration.
llm:
    # true if the model is hosted on MS Foundry
    # false otherwise (e.g., OpenAI, NVIDIA, OpenRouter, Ollama)
    is_azure: false

    #   "responses" -> POST /v1/responses         (primary OpenAI API)
    #   "chat"      -> POST /v1/chat/completions  (legacy, still supported)
    api_style: "responses"

    # ---------- >>> NVIDIA Open LLM <<< ----------------------------
    model_base_url: "https://integrate.api.nvidia.com/v1"
    model: "nvidia/nemotron-3-ultra-550b-a55b"
    api_key_env: "NVIDIA_API_KEY"
    temperature: 0.2

    # Seconds to wait for each LLM response before failing.
    timeout_seconds: 120
    # Concurrent prompts ≈ prompts per second × average seconds per prompt.
    max_concurrent_prompts: 10
    # Responses API: store responses on the server and send only new
    # items each turn via previous_response_id.
    is_stateful: false

    # System prompt sent to the **stateless** LLM on every request.
    system_instructions: >-
        You are a careful math assistant tutor helping solve math problems.
        Always write a short plan first. Do NOT do arithmetic in your head.
        For every math operation, request a tool call to the calculator.
        After tool results, continue. Provide final answer with explanation.
        Respond in plain text only. Do NOT use LaTeX, Markdown, or any other
        special formatting: no backslashes, no asterisks, no dollar-sign or
        parenthesis math delimiters. Write math inline, like 4 x 3 = 12.
        Your answer is shown in a plain text box that cannot render
        formatting.

# "server" section is ONLY loaded by local docker. ACA does not use this
# section.  Instead ACA uses the "server" settings from App Configuration.
server:
    calculator_mcp:
        # Calculator MCP Server running on the Docker host
        url: "http://host.docker.internal:8080/mcp"
        is_oauth: false
        # token_dir not needed when OAuth is not used.
        token_dir: ""
        # callback_port not needed when OAuth is not used.
        callback_port: 0

# "web" section is ONLY loaded by local docker. ACA does not use this
# section.  Instead ACA uses the "web" settings from App Configuration.
web:
    # Listen on all interfaces so the published port is reachable.
    host: "0.0.0.0"
    # Azure Container Apps uses one target port (8080) for every app.
    port: 8080

# "logging" section is loaded by both local docker and ACA.
logging:
    version: 1
    disable_existing_loggers: false
    formatters:
        # NO_COLOR=true is set in the docker image, so colorlog writes
        # plain text with no ANSI color codes.
        standard:
            (): colorlog.ColoredFormatter
            fmt: "%(asctime)s %(log_color)s[%(levelname)s]%(reset)s %(fg_147)s%(name)s %(filename)s:%(lineno)d%(reset)s: %(log_color)s%(message)s%(reset)s"
            datefmt: "%H:%M:%S"
            log_colors:
                DEBUG: cyan
                INFO: light_green
                WARNING: yellow
                ERROR: red
                CRITICAL: bold_red
            stream: ext://sys.stderr
    handlers:
        console:
            class: logging.StreamHandler
            formatter: standard
            stream: ext://sys.stderr
    loggers:
        #############################################################
        # ---------- >>> math_ai_agent <<< -------------------------#
        #############################################################
        math_ai_agent:
            level: INFO
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> fastmcp <<< -------------------------------#
        #############################################################
        fastmcp:
            level: INFO
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> mcp <<< -----------------------------------#
        #############################################################
        mcp:
            level: INFO
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> httpx <<< ---------------------------------#
        #############################################################
        # HTTP request/response summaries — set to INFO to log them.
        # The HTTPX_LOG_LEVEL environment variable overrides this level.
        httpx:
            level: WARNING
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> httpcore <<< ------------------------------#
        #############################################################
        # HTTP wire-level tracing (headers, TCP) — set to DEBUG for detail
        httpcore:
            level: WARNING
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> openai <<< --------------------------------#
        #############################################################
        # Not configured here so the OpenAI SDK's OPENAI_LOG environment
        # variable (lowercase, e.g. "debug") sets the "openai" level.
        #############################################################
        # ---------- >>> uvicorn <<< -------------------------------#
        #############################################################
        # Server: startup, shutdown, and errors
        uvicorn:
            level: INFO
            handlers:
                - console
            propagate: false
        # HTTP access lines, mostly ACA health probes — set to INFO to log them
        uvicorn.access:
            level: WARNING
            handlers:
                - console
            propagate: false
    root:
        level: WARNING
        handlers:
            - console
