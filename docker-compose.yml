# =============================================================================
# Math AI Agent — Docker Compose definition.
#
# Requires NVIDIA_API_KEY in the shell and calculator-mcp on host port 8080.
#
#   docker compose up --build -d
#   docker compose ps
#   docker compose logs -f math-ai-agent
#   docker compose down
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================

services:
  math-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set from the shell so the label tracks pyproject.toml:
        #   APP_VERSION="$(poetry version -s)" docker compose up --build -d
        APP_VERSION: "${APP_VERSION:-0.0.0-dev}"
    image: "math-ai-agent:${APP_VERSION:-latest}"
    container_name: math-ai-agent

    # Runs tini as PID 1: reaps zombies and forwards SIGTERM.
    init: true

    restart: unless-stopped

    ports:
      - "9090:8080"

    environment:
      # Passed through from the shell; fails fast when unset.
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:?NVIDIA_API_KEY is not set}"

    # Makes host.docker.internal resolve on Linux as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    stop_grace_period: 15s

    security_opt:
      # stops any process in the container from gaining extra privileges
      # through setuid/setgid binaries or file capabilities.
      - no-new-privileges:true
    cap_drop:
      # removes every Linux capability Docker grants by default, such as
      # CHOWN, NET_RAW and SETUID. The app doesn't need any of them.
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
